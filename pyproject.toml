[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-tracker"
version = "0.1.0"
description = "Self-hosted hobby practice tracker with timer, REST API and MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
practice-tracker = "practice_tracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
practice_tracker = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
