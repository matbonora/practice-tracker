<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6bed">
  <title>Practice</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1 id="title">Practice</h1>
    <button id="settings-btn" class="icon" aria-label="Settings">⚙</button>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav id="tabs">
    <button data-tab="timer" class="active">Timer</button>
    <button data-tab="inbox">Inbox <span id="inbox-badge" class="badge" hidden></span></button>
    <button data-tab="items">Items</button>
    <button data-tab="log">Log</button>
    <button data-tab="stats">Stats</button>
  </nav>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
